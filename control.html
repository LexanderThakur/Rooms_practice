<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
body{
    margin:0;
    font-family: Arial, sans-serif;
}

.control-bar{
    position:fixed;
    left:0;
    top:0;
    height:100vh;
    width:220px;
    background:#1f2937;
    padding-top:40px;
    box-shadow:-2px 0 10px rgba(0,0,0,0.2);
}

.title{
    color:white;
    text-align:center;
    margin-bottom:40px;
    font-size:20px;
}

.option{
    color:white;
    padding:15px 20px;
    margin:10px 15px;
    border-radius:8px;
    background:#374151;
    cursor:pointer;
    transition:0.3s;
    text-align:center;
}

.option:hover{
    background:#4b5563;
    transform:translateX(-5px);
}
</style>
  </head>
  <body>


    
<div class="control-bar">
    <div class="title">Control</div>
    <div class="option">Create Room</div>
    <div class="option">Join Room</div>
    <div class="option">Your Rooms</div>
</div>



    </div>
  </body>
</html>
